[workspace]
resolver = "2"
members = [
  "crates/pypdf-rs-core",
  "crates/pypdf-py",
]

[workspace.package]
version = "7.1.1"
edition = "2021"
rust-version = "1.83"
license = "BSD-3-Clause"

[workspace.dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }

[profile.release]
lto = "thin"
codegen-units = 16
